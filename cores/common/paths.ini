# Language-neutral path SSOT (build_env/paths-ssot). Edit only here.
# KEY=value, '/' separators, no substitution, '#' comments. Values are relative.
# Rust: cores/rust/common/build.rs -> const &str (common::paths).
# Python: python -m skim_search.gen_paths -> generated region of skim_search/__init__.py.
# Absolute paths are joined at runtime only (never baked into the exe or generated files).

[repo]
# relative to the repository root (the directory that contains this file's PATHS_INI path)
PATHS_INI=cores/common/paths.ini
CARGO_WORKSPACE=cores/rust
RUST_LOCK=cores/rust/Cargo.lock
PYTHON_PROJECT=cores/python
SAMPLE_TREE=cores/rust/tests/fixtures/sample/tree
SCRIPTS=scripts
CONFIGS=configs
ONE_SHOT_CONFIG=configs/one-shot.json
SECURITY_EXCEPTIONS=configs/security-exceptions.json
ISSUES=issues
PRIORITY=issues/priority.md
TARGET=target
ONE_SHOT_TARGET=target/one-shot
EXE_DEBUG=target/debug/skim-search.exe
EXE_RELEASE=target/release/skim-search.exe
EVIDENCE=ref/actual
LOGS=ref/actual/logs
APP_LOG=ref/actual/logs/skim-search.log
ONE_SHOT_LOGS=ref/actual/logs/one-shot
SECURITY_LOGS=ref/actual/logs/security
SHOTS=ref/actual/screenshot/frames

[third_party]
# relative to CavemanDrive/3rd_party (nearest ancestor of the repository that contains THIRD_PARTY)
THIRD_PARTY=3rd_party
RG_DIR=ripgrep
SK_DIR=skim
RG=ripgrep/rg.exe
SK=skim/sk.exe
UV=pk_system/uv.exe
GITLEAKS=security/gitleaks.exe
RELEASES=skim-search
VERSIONS=skim-search/versions.json
